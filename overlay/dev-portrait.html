<!doctype html>
<html><head><meta charset="utf-8"><title>Portrait-Vorschau 720×1280</title>
<style>body{margin:0;background:#333;display:flex;gap:24px;padding:16px}
iframe{border:1px solid #888;background:#111;transform-origin:top left}
.p{width:720px;height:1280px;transform:scale(.42)}
.wrap{width:calc(720px*.42);height:calc(1280px*.42)}</style></head>
<body><div class="wrap"><iframe class="p" src="/?autostart=1" allow="autoplay"></iframe></div></body></html>
