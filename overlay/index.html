<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nixgame Overlay</title>
  </head>
  <body>
    <canvas id="entity"></canvas>
    <canvas id="grid"></canvas>
    <aside id="repl"></aside>
    <div id="ticker"></div>
    <div id="credit"></div>
    <div id="hint"></div>
    <div id="tools" hidden>
      <span class="tools-label">Stil</span>
      <span id="tools-styles"></span>
      <span class="tools-sep"></span>
      <span class="tools-label">BPM</span>
      <button data-bpm="-5">−</button>
      <span id="tools-bpm">120</span>
      <button data-bpm="+5">+</button>
      <span class="tools-sep"></span>
      <button id="tools-clear">Territorium räumen</button>
      <span class="tools-help">Klick: setzen/wechseln · Rad: transponieren · Rechtsklick: löschen</span>
    </div>
    <div id="arm">
      <button id="arm-btn">⦿ &nbsp;ENTITÄT WECKEN</button>
      <p>startet Audio &amp; Kamera — einmal klicken (Autoplay-Policy)</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
